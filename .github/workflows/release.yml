name: Release

# To release:
#   1. Bump "version" in package.json (e.g. `npm version 0.3.0 --no-git-tag-version`) in a PR.
#   2. Merge it into main once CI passes.
#   3. On the updated main: `git tag vX.Y.Z && git push origin vX.Y.Z`
# This workflow then checks the tag, runs the tests, and attaches the packed tarball to a
# GitHub Release, which is what `#semver:` installs resolve to. Nothing is published to npm.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the next step can check the tag is on main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1; }
      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points at a commit that isn't on main. Merge first, then tag main."; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run test:smoke
      - name: Pack
        run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<NOTES
          ## Install

          \`\`\`bash
          npm i -D "github:${GITHUB_REPOSITORY}#semver:^${GITHUB_REF_NAME#v}"
          npx claude-shadcn-cli init
          \`\`\`

          Or install the attached tarball: \`npm i -D https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${TARBALL}\`
          NOTES
          )"
